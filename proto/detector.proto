// Mirrors docs/contrato.md §2: same fields as REST, but the image travels as raw bytes.
// Internal service (gateway and streaming consumer → inference): unary RPCs only.
syntax = "proto3";

package billboard_detector.v1;

service Detector {
  // One image → its detections.
  rpc Detect(DetectRequest) returns (DetectResponse);
  // Model loaded in this server (the gateway uses it for /health and /v1/model).
  rpc GetModel(GetModelRequest) returns (ModelInfo);
  // Forces a lookup of the champion in MLflow; returns the resulting model.
  rpc Reload(ReloadRequest) returns (ModelInfo);
}

message DetectRequest {
  bytes image = 1;                    // JPEG or PNG, ≤ 5 MB, longest side ≤ 4096 px
  optional float score_threshold = 2; // 0.0–1.0; when unset, the model's calibrated threshold
  string frame_id = 3;                // optional; returned unchanged in the response (traceability)
}

message ModelRef {
  string name = 1;
  string version = 2;
  string alias = 3;
}

message ImageSize {
  int32 width = 1;
  int32 height = 2;
}

message Detection {
  string label = 1;
  float score = 2;
  repeated float box = 3; // [x_min, y_min, x_max, y_max] in pixels of the original image
}

message DetectResponse {
  string request_id = 1;
  ModelRef model = 2;
  ImageSize image = 3;
  repeated Detection detections = 4; // sorted by descending score
  float latency_ms = 5;                 // server side: wait for a slot + decoding + forward pass
  string frame_id = 6;                  // the request's frame_id
}

message GetModelRequest {}

message ReloadRequest {}

message ModelInfo {
  bool loaded = 1;                  // false until there is a champion
  ModelRef model = 2;
  repeated string labels = 3;
  float score_threshold = 4;        // default (calibrated) threshold
  map<string, double> metrics = 5;  // gate metrics (gate_map, gate_map_50, 95 % CI)
  string eval_set = 6;              // set they were measured on, e.g. reviewed/test.json@<sha>
}
