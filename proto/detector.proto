// Espejo de docs/contrato.md §2: mismos campos que REST, pero la imagen viaja como bytes.
// Servicio interno (gateway y consumidor de streaming → inference): solo RPCs unarios.
syntax = "proto3";

package vallavision.v1;

service Detector {
  // Una imagen → sus detecciones.
  rpc Detect(DetectRequest) returns (DetectResponse);
  // Modelo cargado en este servidor (lo usa el gateway para /health y /v1/model).
  rpc GetModel(GetModelRequest) returns (ModelInfo);
  // Fuerza la búsqueda del champion en MLflow; devuelve el modelo resultante.
  rpc Reload(ReloadRequest) returns (ModelInfo);
}

message DetectRequest {
  bytes image = 1;                    // JPEG o PNG, ≤ 5 MB, lado mayor ≤ 4096 px
  optional float score_threshold = 2; // 0.0–1.0; sin valor usa el umbral calibrado del modelo
  string frame_id = 3;                // opcional; se devuelve igual en la respuesta (trazabilidad)
}

message ModelRef {
  string name = 1;
  string version = 2;
  string alias = 3;
}

message ImageSize {
  int32 width = 1;
  int32 height = 2;
}

message Detection {
  string label = 1;
  float score = 2;
  repeated float box = 3; // [x_min, y_min, x_max, y_max] en píxeles de la imagen original
}

message DetectResponse {
  string request_id = 1;
  ModelRef model = 2;
  ImageSize image = 3;
  repeated Detection detections = 4; // ordenadas por score descendente
  float latency_ms = 5;                 // en el servidor: espera de turno + decodificado + forward
  string frame_id = 6;                  // el de la request
}

message GetModelRequest {}

message ReloadRequest {}

message ModelInfo {
  bool loaded = 1;                  // false mientras no haya champion
  ModelRef model = 2;
  repeated string labels = 3;
  float score_threshold = 4;        // umbral calibrado por defecto
  map<string, double> metrics = 5;  // métricas del gate (gate_map, gate_map_50, IC 95 %)
  string eval_set = 6;              // set sobre el que se midieron, p. ej. reviewed/test.json@<sha>
}
