# Override para escalar la inferencia: varias réplicas del modelo detrás del gateway.
#
#   docker compose -f docker-compose.yaml -f docker-compose.scale.yaml --profile all \
#     up -d --scale inference=2
#
# Con varias réplicas no puede haber un puerto fijo en el host: cada una toma uno libre del
# rango y cambia al recrearse (`docker compose port --index 1 inference 50051`). El camino
# soportado en este modo es el gateway REST (:8800), que reparte la carga por DNS con
# round_robin; para gRPC directo usar el puerto que informe el comando anterior.
services:
  inference:
    ports: !override
      - "50051-50059:50051"
